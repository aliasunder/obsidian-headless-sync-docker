name: Trivy

# Scans the Docker image for OS-layer and dependency CVEs — the gap gitleaks and
# Dependabot leave open (alpine base packages + post-release CVE drift live only
# in the built image). Scope is vulnerability scanning only.
#
# Two targets:
#   - trivy-published (cron + merges to main + dispatch): scans the GHCR :latest
#     image users pull, so a CVE disclosed after a release still surfaces.
#     Report-only — there is no merge to block.
#   - trivy-pr (pull_request): an image built from the branch, so a CVE entering
#     via Dockerfile/base-image changes surfaces before merge. It exits non-zero
#     on CRITICAL/HIGH to gate the PR; its job ID is the required-status-check
#     context in the branch ruleset.

on:
  schedule:
    - cron: "23 9 * * 1" # weekly, Monday 09:23 UTC
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trivy-published:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # SARIF upload to the Security tab
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Scan published image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          # Manifest list resolves per-runner (amd64 here); the alpine OS package
          # set is identical across arches, so amd64-only is fine.
          image-ref: ghcr.io/aliasunder/obsidian-headless-sync-docker:latest
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: sarif
          output: trivy-results.sarif
          exit-code: "0"

      - name: Upload SARIF to the Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          sarif_file: trivy-results.sarif
          category: trivy-published-image

  trivy-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # SARIF upload to the Security tab
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Build image from branch
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          # Load into the local daemon so the scan step can reference it by tag.
          load: true
          tags: obsidian-headless-sync-docker:pr-scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan branch image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          image-ref: obsidian-headless-sync-docker:pr-scan
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: sarif
          output: trivy-results.sarif
          exit-code: "1" # gate: fail the PR on CRITICAL/HIGH findings

      # Fork PRs don't get security-events write access, so the upload would 403 —
      # scan results still show in the job log for forks.
      - name: Upload SARIF to the Security tab
        if: always() && github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          sarif_file: trivy-results.sarif
          category: trivy-pr-image
